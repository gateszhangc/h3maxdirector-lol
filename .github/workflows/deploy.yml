name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_REPO: h3maxdirector-lol
  APP_DOMAIN: https://h3maxdirector.lol
  IMAGE: ghcr.io/gateszhangc/h3maxdirector-lol

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gateszhangc
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.APP_DOMAIN }}
            NEXT_PUBLIC_APP_NAME=H3 Max Director
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update k8s-fleet newTag
        env:
          FLEET_TOKEN: ${{ secrets.K8S_FLEET_TOKEN }}
          KUSTOMIZE: tenants/${{ env.APP_REPO }}/kustomization.yaml
        run: |
          set -euo pipefail
          git clone "https://gateszhangc:${FLEET_TOKEN}@github.com/gateszhangc/k8s-fleet.git" fleet
          cd fleet
          sed -i "s|newTag: sha-.*|newTag: sha-${GITHUB_SHA}|" "${KUSTOMIZE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${KUSTOMIZE}"
          git diff --cached --quiet || git commit -m "release: ${APP_REPO} sha-${GITHUB_SHA:0:7} (auto)"
          git push origin main

      - name: Wait for site to come back
        run: |
          for i in $(seq 1 72); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ env.APP_DOMAIN }}" || true)
            if [ "$code" = "200" ]; then
              echo "site OK (${code})"
              exit 0
            fi
            sleep 10
          done
          echo "site did not return 200 within 12m"
          exit 1
